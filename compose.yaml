name: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME in the server .env file}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baho_ims}
      POSTGRES_USER: ${POSTGRES_USER:-baho}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly pg_dump into ./backups on the VPS (see deployment/README.md, "Backups").
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-baho_ims}
      PGUSER: ${POSTGRES_USER:-baho}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env file}
      TZ: ${BACKUP_TZ:-Africa/Kigali}
      BACKUP_HOUR: ${BACKUP_HOUR:-1}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deployment/backup.sh:/scripts/backup.sh:ro
      - ./backups:/backups
    networks:
      - data
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server .env file}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the server .env file}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-true}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DATABASE_URL: postgres://${POSTGRES_USER:-baho}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env file}@db:5432/${POSTGRES_DB:-baho_ims}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SMS_BACKEND: ${SMS_BACKEND:-console}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
    volumes:
      - static_data:/app/staticfiles
    networks:
      - data
      - web
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Every 10 minutes: retries SMS that failed to send, and empties the Trash of
  # records deleted more than TRASH_RETENTION_HOURS ago (default 24).
  sms-worker:
    build:
      context: ./backend
    restart: unless-stopped
    command: ["sh", "-c", "while true; do python manage.py send_pending_sms || true; python manage.py purge_trash || true; sleep 600; done"]
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in the server .env file}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set DJANGO_ALLOWED_HOSTS in the server .env file}
      DATABASE_URL: postgres://${POSTGRES_USER:-baho}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the server .env file}@db:5432/${POSTGRES_DB:-baho_ims}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SMS_BACKEND: ${SMS_BACKEND:-console}
      SMS_SENDER_ID: ${SMS_SENDER_ID:-}
      AFRICASTALKING_USERNAME: ${AFRICASTALKING_USERNAME:-}
      AFRICASTALKING_API_KEY: ${AFRICASTALKING_API_KEY:-}
      TRASH_RETENTION_HOURS: ${TRASH_RETENTION_HOURS:-24}
    networks:
      - data  # not internal, so the worker can reach the SMS provider
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    volumes:
      - static_data:/usr/share/nginx/html/static:ro
    networks:
      web: {}
      edge:
        aliases:
          - baho-web
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:

networks:
  data: {}
  web:
    internal: true
  edge:
    external: true
    name: edge