name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once; a newer push waits for the running one.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$VPS_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Sync project files
        run: >-
          rsync -az
          --exclude='.git/'
          --exclude='.env'
          --exclude='backend/.env'
          --exclude='frontend/.env'
          --exclude='backend/.venv/'
          --exclude='frontend/node_modules/'
          --exclude='frontend/dist/'
          --exclude='backups/'
          -e "ssh -p ${VPS_SSH_PORT:-22}"
          ./ "${VPS_USER}@${VPS_HOST}:${VPS_DEPLOY_PATH}/"

      # Migrations run when the new backend starts, so take a dump first.
      # Aborts the deployment if the database is running but the dump fails.
      - name: Back up the database before migrating
        run: >-
          ssh -p "${VPS_SSH_PORT:-22}"
          "${VPS_USER}@${VPS_HOST}"
          "cd '${VPS_DEPLOY_PATH}' && sh deployment/predeploy-backup.sh"

      - name: Build and restart application
        run: >-
          ssh -p "${VPS_SSH_PORT:-22}"
          "${VPS_USER}@${VPS_HOST}"
          "cd '${VPS_DEPLOY_PATH}' && docker compose up -d --build"
